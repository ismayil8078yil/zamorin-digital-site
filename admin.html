<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zamorin Digital — Admin</title>
<link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='7.5' y='7.5' width='25' height='25' rx='5' transform='rotate(45 20 20)' fill='%230B3D2E' stroke='%23C9A227' stroke-width='1.6'/%3E%3Ctext x='20' y='26.5' text-anchor='middle' font-family='serif' font-style='italic' font-size='17' fill='%23C9A227'%3EZ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@300..800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{forest:'#0B3D2E',deep:'#07271d',cream:'#FAF7F0',gold:'#C9A227',goldLight:'#E3C458',goldDeep:'#A8861B'},fontFamily:{disp:['Fraunces','Georgia','serif'],body:['Manrope','system-ui','sans-serif']}}}}</script>
<style>
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,#0B3D2E 0%,#07271d 100%);min-height:100vh;color:#FAF7F0}
::selection{background:#C9A227;color:#07271d}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#07271d}
::-webkit-scrollbar-thumb{background:linear-gradient(#E3C458,#A8861B);border-radius:8px;border:2px solid #07271d}
.glass{background:rgba(255,255,255,.055);border:1px solid rgba(201,162,39,.22);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:1rem}
.inp{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(250,247,240,.16);color:#FAF7F0;border-radius:.8rem;padding:.75rem 1rem;font-size:.92rem;outline:none;transition:.25s}
.inp::placeholder{color:rgba(250,247,240,.35)}
.inp:focus{border-color:#C9A227;box-shadow:0 0 0 3px rgba(201,162,39,.18);background:rgba(255,255,255,.09)}
select.inp option{background:#07271d;color:#FAF7F0}
.lbl{display:block;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(250,247,240,.55);font-weight:700;margin-bottom:.4rem}
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,#E3C458,#C9A227 50%,#A8861B);color:#07271d;font-weight:700;padding:.8rem 1.7rem;border-radius:9999px;transition:transform .3s,box-shadow .3s;box-shadow:0 10px 26px -12px rgba(201,162,39,.6)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 16px 34px -12px rgba(201,162,39,.75)}
.btn-gold:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(201,162,39,.4);color:#FAF7F0;font-weight:600;padding:.55rem 1.1rem;border-radius:9999px;font-size:.8rem;transition:.25s}
.btn-ghost:hover{background:rgba(201,162,39,.14);border-color:#C9A227}
.btn-red{display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(248,113,113,.45);color:#fca5a5;font-weight:600;padding:.55rem 1.1rem;border-radius:9999px;font-size:.8rem;transition:.25s}
.btn-red:hover{background:rgba(248,113,113,.12);border-color:#f87171}
.tabbtn{padding:.75rem .5rem;border-radius:9999px;font-size:.85rem;font-weight:700;border:1px solid rgba(250,247,240,.14);color:rgba(250,247,240,.7);transition:.25s;white-space:nowrap}
.tabbtn.on{background:linear-gradient(135deg,#E3C458,#A8861B);color:#07271d;border-color:transparent;box-shadow:0 10px 24px -12px rgba(201,162,39,.7)}
.tag{display:inline-block;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:#C9A227;border:1px solid rgba(201,162,39,.45);border-radius:9999px;padding:.25rem .7rem;font-weight:700}
.glow{position:fixed;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.14),transparent 65%);filter:blur(40px)}
#toast{position:fixed;left:50%;bottom:24px;z-index:120;transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:.35s;background:rgba(7,39,29,.96);border:1px solid rgba(201,162,39,.55);color:#FAF7F0;padding:.75rem 1.6rem;border-radius:9999px;font-size:.85rem;box-shadow:0 18px 40px -12px rgba(0,0,0,.55);max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body class="font-body antialiased">
<div class="glow" style="width:480px;height:480px;top:-160px;right:-140px"></div>
<div class="glow" style="width:420px;height:420px;bottom:-140px;left:-120px"></div>
<div id="bootView" class="min-h-screen flex items-center justify-center">
<div class="text-center">
<svg viewBox="0 0 40 40" class="w-12 h-12 mx-auto animate-pulse"><rect x="7.5" y="7.5" width="25" height="25" rx="5" transform="rotate(45 20 20)" fill="none" stroke="#C9A227" stroke-width="1.6"/><text x="20" y="26.5" text-anchor="middle" font-family="Fraunces,serif" font-style="italic" font-size="17" fill="#C9A227">Z</text></svg>
<p class="mt-4 text-cream/50 text-sm tracking-[.25em] uppercase">Loading…</p>
</div>
</div>
<div id="loginView" class="hidden min-h-screen flex items-center justify-center p-4">
<div class="glass w-full max-w-md p-8 md:p-10 rounded-2xl shadow-2xl">
<div class="text-center">
<svg viewBox="0 0 40 40" class="w-12 h-12 mx-auto"><rect x="7.5" y="7.5" width="25" height="25" rx="5" transform="rotate(45 20 20)" fill="none" stroke="#C9A227" stroke-width="1.6"/><text x="20" y="26.5" text-anchor="middle" font-family="Fraunces,serif" font-style="italic" font-size="17" fill="#C9A227">Z</text></svg>
<h1 class="font-disp text-2xl mt-4">Zamorin Digital</h1>
<p class="text-cream/50 text-xs tracking-[.3em] uppercase mt-1">Private Admin Panel</p>
</div>
<form id="loginForm" class="mt-8 space-y-4">
<div><label class="lbl" for="lEmail">Email</label><input id="lEmail" type="email" class="inp" required autocomplete="email" placeholder="you@studio.com"></div>
<div><label class="lbl" for="lPass">Password</label><input id="lPass" type="password" class="inp" required autocomplete="current-password" placeholder="••••••••"></div>
<p id="loginErr" class="text-red-400 text-sm min-h-[1.2rem]"></p>
<button id="loginBtn" type="submit" class="btn-gold w-full">Sign In</button>
</form>
<p class="text-center text-cream/35 text-xs mt-6">Authorized access only.</p>
</div>
</div>
<div id="appView" class="hidden">
<header class="sticky top-0 z-50 glass !rounded-none border-x-0 border-t-0">
<div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
<div class="flex items-center gap-3 min-w-0">
<svg viewBox="0 0 40 40" class="w-8 h-8 shrink-0"><rect x="7.5" y="7.5" width="25" height="25" rx="5" transform="rotate(45 20 20)" fill="none" stroke="#C9A227" stroke-width="1.6"/><text x="20" y="26.5" text-anchor="middle" font-family="Fraunces,serif" font-style="italic" font-size="17" fill="#C9A227">Z</text></svg>
<div class="min-w-0">
<div class="font-disp text-sm leading-none truncate">Zamorin Digital</div>
<div class="text-[10px] tracking-[.25em] uppercase text-gold mt-1">Admin</div>
</div>
</div>
<button onclick="logout()" class="btn-ghost shrink-0">Logout</button>
</div>
</header>
<main class="max-w-5xl mx-auto px-4 py-6 md:py-10">
<div class="grid grid-cols-3 gap-2 md:gap-3 max-w-md mx-auto">
<button class="tabbtn on" data-tab="projects" onclick="switchTab('projects')">Projects</button>
<button class="tabbtn" data-tab="enquiries" onclick="switchTab('enquiries')">Enquiries</button>
<button class="tabbtn" data-tab="settings" onclick="switchTab('settings')">Settings</button>
</div>
<section id="tab-projects" class="mt-8 space-y-6">
<div class="glass rounded-2xl p-5 md:p-7">
<h2 id="projFormTitle" class="font-disp text-xl text-cream">Add Project</h2>
<form id="projForm" class="mt-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
<div><label class="lbl" for="pName">Name</label><input id="pName" class="inp" required placeholder="Project name"></div>
<div><label class="lbl" for="pNiche">Niche</label>
<select id="pNiche" class="inp" required>
<option value="finance">finance</option><option value="weddings">weddings</option><option value="healthcare">healthcare</option><option value="hospitality">hospitality</option><option value="ecommerce">ecommerce</option>
</select></div>
<div class="sm:col-span-2"><label class="lbl" for="pDesc">Description</label><input id="pDesc" class="inp" required placeholder="One-line description"></div>
<div class="sm:col-span-2"><label class="lbl" for="pLink">Link (live URL)</label><input id="pLink" class="inp" type="url" required placeholder="https://…"></div>
<div><label class="lbl" for="pImg">Image URL (optional)</label><input id="pImg" class="inp" type="url" placeholder="https://…"></div>
<div><label class="lbl" for="pOrder">Sort Order</label><input id="pOrder" class="inp" type="number" value="0" step="1"></div>
<div class="sm:col-span-2 flex flex-wrap gap-3">
<button id="projSubmit" type="submit" class="btn-gold">Add Project</button>
<button id="projCancel" type="button" class="btn-ghost hidden" onclick="resetProjForm()">Cancel Edit</button>
</div>
</form>
</div>
<div id="projList" class="space-y-3"></div>
</section>
<section id="tab-enquiries" class="mt-8 hidden">
<div id="enqList" class="space-y-4"></div>
</section>
<section id="tab-settings" class="mt-8 hidden">
<div class="glass rounded-2xl p-5 md:p-7 max-w-2xl">
<h2 class="font-disp text-xl text-cream">Site Settings</h2>
<p class="text-cream/50 text-sm mt-1">These override defaults on the live site. Leave blank to keep defaults (blank values are ignored by the site).</p>
<div class="mt-5 space-y-4">
<div><label class="lbl" for="sLogo">logo_src</label><input id="sLogo" class="inp" placeholder="https://…/logo.png"></div>
<div><label class="lbl" for="sFounder">founder_photo</label><input id="sFounder" class="inp" placeholder="https://…/founder.jpg"></div>
<div><label class="lbl" for="sMarquee">marquee_items (JSON array)</label><textarea id="sMarquee" class="inp min-h-[120px] font-mono text-sm" placeholder='["Rose Pearl","Smile Care","Zamorin Vault"]'></textarea></div>
<button onclick="saveSettings()" class="btn-gold w-full sm:w-auto">Save Settings</button>
</div>
</div>
</section>
</main>
</div>
<div id="toast">Saved</div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const SUPABASE_URL='https://baabkhsgidzelistjler.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhYWJraHNnaWR6ZWxpc3RqbGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NTIyMjAsImV4cCI6MjEwNDIyODIyMH0.e1eGQWaZwFatVFk6otXP1qfGagJNxjeAxn65a-aFtPU';
let sb=null;try{if(window.supabase&&window.supabase.createClient)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
function show(view){['bootView','loginView','appView'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==view))}
let PROJ=[],editingId=null,settingsLoaded=false;
async function init(){
if(!sb){show('loginView');$('#loginErr').textContent='Supabase failed to load. Check your connection.';$('#loginBtn').disabled=true;return}
try{const {data}=await sb.auth.getSession();
if(data&&data.session){enterApp()}else{show('loginView')}}
catch(e){show('loginView')}
try{sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')show('loginView')})}catch(e){}}
$('#loginForm').addEventListener('submit',async e=>{
e.preventDefault();
$('#loginErr').textContent='';
const btn=$('#loginBtn');btn.disabled=true;btn.textContent='Signing in…';
try{const {error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
if(error){$('#loginErr').textContent=error.message||'Sign-in failed.';return}
$('#lPass').value='';enterApp()}
catch(ex){$('#loginErr').textContent='Sign-in failed. Check your connection.'}
finally{btn.disabled=false;btn.textContent='Sign In'}});
function enterApp(){show('appView');loadProjects();loadEnquiries();loadSettings()}
async function logout(){try{await sb.auth.signOut();toast('Signed out')}catch(e){toast('Sign-out failed')}show('loginView')}
function switchTab(name){$$('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));['projects','enquiries','settings'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==name))}
async function loadProjects(){
try{const {data,error}=await sb.from('projects').select('*').order('sort_order',{ascending:true});
if(error)throw error;PROJ=data||[];renderProjects();toast('Projects loaded')}
catch(e){toast('Could not load projects');renderProjects()}}
function renderProjects(){
if(!PROJ.length){$('#projList').innerHTML='<div class="glass rounded-2xl p-6 text-center text-cream/50 text-sm">No projects yet. Add the first one above.</div>';return}
$('#projList').innerHTML=PROJ.map((p,i)=>{
const link=p.url||p.link||'#';
return '<div class="glass rounded-2xl p-4 md:p-5 flex flex-col sm:flex-row sm:items-center gap-4"><div class="flex-1 min-w-0"><div class="flex items-center gap-3 flex-wrap"><h3 class="font-disp text-lg text-cream">'+esc(p.name)+'</h3><span class="tag">'+esc(p.niche||'—')+'</span><span class="text-cream/35 text-xs">order '+esc(p.sort_order??'')+'</span></div><p class="text-cream/60 text-sm mt-1">'+esc(p.description||'')+'</p><a href="'+esc(link)+'" target="_blank" rel="noopener" class="block text-gold text-xs mt-1.5 break-all">'+esc(link)+'</a></div><div class="flex gap-2 shrink-0"><button class="btn-ghost" onclick="editProj('+i+')">Edit</button><button class="btn-red" onclick="delProj('+i+')">Delete</button></div></div>'}).join('')}
function editProj(i){const p=PROJ[i];if(!p)return;editingId=p.id;
$('#pName').value=p.name||'';$('#pNiche').value=p.niche||'finance';$('#pDesc').value=p.description||'';
$('#pLink').value=p.url||p.link||'';$('#pImg').value=p.img||p.image||'';$('#pOrder').value=p.sort_order??0;
$('#projFormTitle').textContent='Edit Project';$('#projSubmit').textContent='Update Project';$('#projCancel').classList.remove('hidden');
$('#projForm').scrollIntoView({behavior:'smooth',block:'start'})}
function resetProjForm(){editingId=null;$('#projForm').reset();$('#pOrder').value=0;
$('#projFormTitle').textContent='Add Project';$('#projSubmit').textContent='Add Project';$('#projCancel').classList.add('hidden')}
$('#projForm').addEventListener('submit',async e=>{
e.preventDefault();
const payload={name:$('#pName').value.trim(),niche:$('#pNiche').value,description:$('#pDesc').value.trim(),url:$('#pLink').value.trim(),img:$('#pImg').value.trim()||null,sort_order:Number($('#pOrder').value)||0};
const btn=$('#projSubmit');btn.disabled=true;
try{let r;
if(editingId==null){r=await sb.from('projects').insert([payload])}
else{r=await sb.from('projects').update(payload).eq('id',editingId)}
if(r.error)throw r.error;
toast(editingId==null?'Project added':'Project updated');
resetProjForm();await loadProjects()}
catch(err){toast('Error: '+(err.message||'action failed'))}
finally{btn.disabled=false}});
async function delProj(i){const p=PROJ[i];if(!p)return;
if(!confirm('Delete "'+(p.name||'this project')+'" permanently?'))return;
try{const {error}=await sb.from('projects').delete().eq('id',p.id);if(error)throw error;
toast('Project deleted');if(editingId===p.id)resetProjForm();await loadProjects()}
catch(e){toast('Error: '+(e.message||'delete failed'))}}
async function loadEnquiries(){
try{const {data,error}=await sb.from('enquiries').select('*').order('created_at',{ascending:false});
if(error)throw error;renderEnquiries(data||[])}
catch(e){toast('Could not load enquiries');renderEnquiries([])}}
function renderEnquiries(list){
if(!list.length){$('#enqList').innerHTML='<div class="glass rounded-2xl p-6 text-center text-cream/50 text-sm">No enquiries yet.</div>';return}
$('#enqList').innerHTML=list.map(q=>{
const em=q.email||'',when=q.created_at?new Date(q.created_at).toLocaleString():'';
return '<div class="glass rounded-2xl p-5"><div class="flex items-start justify-between gap-3 flex-wrap"><div class="min-w-0"><h3 class="font-disp text-lg text-cream">'+esc(q.name||'Unknown')+'</h3><p class="text-gold text-sm break-all">'+esc(em)+'</p>'+(q.phone?'<p class="text-cream/50 text-xs mt-0.5">'+esc(q.phone)+'</p>':'')+(q.industry?'<p class="text-cream/50 text-xs">'+esc(q.industry)+'</p>':'')+'</div>'+(when?'<span class="text-cream/35 text-xs shrink-0">'+esc(when)+'</span>':'')+'</div><p class="text-cream/70 text-sm mt-3 leading-relaxed whitespace-pre-wrap">'+esc(q.message||'')+'</p><div class="flex flex-wrap gap-2 mt-4"><button class="btn-ghost" onclick="copyEmail(this)" data-email="'+esc(em)+'">Copy email</button><a class="btn-ghost" href="mailto:'+esc(em)+'">Mailto</a></div></div>'}).join('')}
async function copyEmail(btn){const em=btn.dataset.email||'';if(!em){toast('No email to copy');return}
try{await navigator.clipboard.writeText(em);toast('Email copied')}
catch(e){try{const t=document.createElement('textarea');t.value=em;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Email copied')}catch(e2){toast('Copy failed')}}}
async function loadSettings(){
try{const {data,error}=await sb.from('settings').select('key,value');
if(error)throw error;const m={};(data||[]).forEach(r=>m[r.key]=r.value);
$('#sLogo').value=m.logo_src||'';$('#sFounder').value=m.founder_photo||'';$('#sMarquee').value=m.marquee_items||'';
settingsLoaded=true;toast('Settings loaded')}
catch(e){toast('Could not load settings')}}
async function saveSettings(){
const marq=$('#sMarquee').value.trim();
if(marq){try{const a=JSON.parse(marq);if(!Array.isArray(a))throw 0}catch(e){toast('marquee_items must be a JSON array');return}}
const pairs=[['logo_src',$('#sLogo').value.trim()],['founder_photo',$('#sFounder').value.trim()],['marquee_items',marq]];
try{for(const p of pairs){const {error}=await sb.from('settings').upsert({key:p[0],value:p[1]});if(error)throw error}
toast('Settings saved')}
catch(e){toast('Error: '+(e.message||'save failed'))}}
init();
</script>
</body>
</html>
